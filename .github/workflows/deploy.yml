name: Update data & deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC (06:00 Berlin summer time)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest raw data
        # keep going if a source is temporarily down; build uses whatever exists
        continue-on-error: true
        run: python scripts/fetch_data.py

      - name: Build lakes.geojson
        run: python scripts/build_geojson.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
